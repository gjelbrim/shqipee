<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Albanian Elbasan Alphabet Converter | shqip.ee</title>
    <meta name="description" content="Convert Albanian text from the Latin alphabet into the historical Elbasan script and back, letter by letter. Free, no sign-up, works offline." />
    <link rel="canonical" href="https://shqip.ee/" />
    <meta name="theme-color" content="#DBE1D5" />
    <script>
      // set the theme before the first paint so dark mode doesn't flash light
      // (see src/theme.svelte.js)
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#1b1f1a';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
