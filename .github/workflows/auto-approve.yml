name: Auto-approve own PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  approve:
    if: github.event.pull_request.user.login == 'gjelbrim' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "$PR" --approve --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
